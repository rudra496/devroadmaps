name: Welcome New Contributors
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome! Thanks for opening your first issue. We'll review it soon."
          pr-message: "Welcome! Thanks for your first PR. A maintainer will review it shortly."
